name: hearth_sync
description: "The OpenHearth sync kernel for Flutter apps: the Rust kernel over flutter_rust_bridge, a platform-held device key, and record stores over Drift and IndexedDB."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  freezed_annotation: ^3.1.0
  # The device key, held by flutter_secure_storage. Signing is native (the Rust
  # bridge) or WebCrypto; cryptography's pure-Dart Ed25519 is the last fallback.
  # Exact pins: the fleet pins security-critical dependencies.
  cryptography: 2.9.0
  flutter_secure_storage: 9.2.4
  # WebCrypto Ed25519 on the web (bindings only; already in the tree).
  web: 1.1.1
  # Record stores (ADR 0010): Drift on native, IndexedDB on the web.
  # DriftPersist uses only customStatement, customSelect and transaction, so
  # any 2.x from 2.28 serves; the fleet's apps are on 2.28 and 2.31, and a
  # floor of 2.34 forced sqlite3 3.x (and a new web sqlite3.wasm) on them.
  drift: '>=2.28.0 <3.0.0'
  idb_shim: ^2.6.0
  # The relay client's transport (POST + dCBOR, docs/reference/relay-protocol.md).
  http: ^1.5.0

dev_dependencies:
  build_runner: ^2.15.0
  freezed: ^3.1.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      linux:
        ffiPlugin: true
