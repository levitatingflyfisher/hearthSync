# The Rust relay behind a line protocol on stdin/stdout, for the Go differential harness
# (go-relay/difftest). Its own workspace, so the repo's workspace is untouched; the lock
# is the repo's, so every crate is the version the relay ships with.
[package]
name = "hearth_relay_diffdriver"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[dependencies]
hearth_sync_relay = { path = "../../../relay" }
serde_json = "1"

# As the repo's workspace: optimised dependencies, so the build reuses target/.
[profile.dev.package."*"]
opt-level = 3
